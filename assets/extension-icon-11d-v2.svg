<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Layered agent interface icon</title>
  <desc id="desc">A compact isometric stack with a dark top panel and four interface nodes.</desc>

  <defs>
    <!-- The extension's aurora ramp (style.css accent gradient token). -->
    <linearGradient id="topGradient" x1="70" y1="90" x2="442" y2="420"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="0.48" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#C95CFF"/>
    </linearGradient>

    <!-- Side faces: the same ramp, ~25% darker. -->
    <linearGradient id="sideGradient" x1="80" y1="100" x2="432" y2="430"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B5ED9"/>
      <stop offset="0.5" stop-color="#6A45D4"/>
      <stop offset="1" stop-color="#9E46D6"/>
    </linearGradient>

    <linearGradient id="nodeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#B9B0FF"/>
    </linearGradient>
  </defs>

  <!-- Top plate side wall: only the two lower faces, so nothing pokes out
       past the left/right tips (a full translated copy left slivers there). -->
  <path d="M66 162 L66 177 L256 285 L446 177 L446 162 L256 270 Z"
        fill="url(#sideGradient)"/>

  <!-- Top plate rim. -->
  <path d="M256 54 L446 162 L256 270 L66 162 Z"
        fill="url(#topGradient)"/>

  <!-- Dark inset panel. -->
  <path d="M256 97 L371 162 L256 227 L141 162 Z"
        fill="#131226"/>

  <!-- Four slightly flattened nodes for the isometric perspective. -->
  <g>
    <ellipse cx="256" cy="121" rx="13" ry="10.5" fill="url(#nodeGradient)"/>
    <ellipse cx="202" cy="162" rx="13" ry="10.5" fill="url(#nodeGradient)"/>
    <ellipse cx="310" cy="162" rx="13" ry="10.5" fill="url(#nodeGradient)"/>
    <ellipse cx="256" cy="203" rx="13" ry="10.5" fill="url(#nodeGradient)"/>
  </g>

  <!-- Middle layer depth, then its bright top edge. -->
  <path d="M88 285 L256 381 L424 285"
        fill="none"
        stroke="url(#sideGradient)"
        stroke-width="34"
        stroke-linecap="round"
        stroke-linejoin="round"
        transform="translate(0 15)"/>

  <path d="M88 285 L256 381 L424 285"
        fill="none"
        stroke="url(#topGradient)"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Bottom layer depth, then its bright top edge. -->
  <path d="M88 374 L256 470 L424 374"
        fill="none"
        stroke="url(#sideGradient)"
        stroke-width="34"
        stroke-linecap="round"
        stroke-linejoin="round"
        transform="translate(0 15)"/>

  <path d="M88 374 L256 470 L424 374"
        fill="none"
        stroke="url(#topGradient)"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
